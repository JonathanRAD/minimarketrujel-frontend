<app-page-header
  title="Proveedores y Distribuidores"
  subtitle="Gestiona tu directorio de proveedores, contactos y datos para órdenes de compra">
  <div style="display: flex; gap: 0.75rem; align-items: center;">
    <button
      class="btn-excel"
      (click)="exportarExcel()"
      [disabled]="excelService.exportando() && excelService.tablaActual() === 'proveedores'">
      <span class="material-icons">file_download</span>
      <span>{{ (excelService.exportando() && excelService.tablaActual() === 'proveedores') ? 'Generando Excel...' : 'Exportar a Excel' }}</span>
    </button>
    <button (click)="abrirModalForm()" class="btn-primary">
      <span class="material-icons">add_business</span>
      <span>Nuevo Proveedor</span>
    </button>
  </div>
</app-page-header>

<app-error-alert [message]="errorMessage()" (dismiss)="errorMessage.set(null)" />

<app-generic-table
  [data]="proveedores()"
  [columns]="columns"
  [loading]="cargando()"
  [showActions]="true"
  searchPlaceholder="Buscar proveedores por nombre, contacto o teléfono..."
  (edit)="abrirModalForm($event.id)"
  (delete)="eliminar($event)"
>
</app-generic-table>
