<app-page-header
  title="Ofertas y Promociones"
  subtitle="Crea y gestiona descuentos, combos y ofertas especiales para tus clientes">
  <button (click)="abrirModalForm()" class="btn-primary">
    <span class="material-icons">local_offer</span>
    <span>Nueva Oferta</span>
  </button>
</app-page-header>

<app-error-alert [message]="errorMessage()" (dismiss)="errorMessage.set(null)" />

<app-generic-table
  [data]="promociones()"
  [columns]="columns"
  [loading]="cargando()"
  [showActions]="true"
  searchPlaceholder="Buscar promociones por título..."
  (edit)="abrirModalForm($event.id)"
  (delete)="eliminar($event)"
>
</app-generic-table>
