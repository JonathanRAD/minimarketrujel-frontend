<app-page-header
  title="Categorías de Productos"
  subtitle="Organiza tus productos por familias y categorías para una mejor gestión">
  <div style="display: flex; gap: 0.75rem; align-items: center;">
    <button
      class="btn-excel"
      (click)="exportarExcel()"
      [disabled]="excelService.exportando() && excelService.tablaActual() === 'categorias'">
      <span class="material-icons">file_download</span>
      <span>{{ (excelService.exportando() && excelService.tablaActual() === 'categorias') ? 'Generando Excel...' : 'Exportar a Excel' }}</span>
    </button>
    <button (click)="abrirModalForm()" class="btn-primary">
      <span class="material-icons">add</span>
      <span>Nueva Categoría</span>
    </button>
  </div>
</app-page-header>

<app-error-alert [message]="errorMessage()" (dismiss)="errorMessage.set(null)" />

<app-generic-table
  [data]="categorias()"
  [columns]="columns"
  [loading]="cargando()"
  [showActions]="true"
  searchPlaceholder="Buscar categorías..."
  (edit)="abrirModalForm($event.id)"
  (delete)="eliminar($event)"
>
</app-generic-table>
