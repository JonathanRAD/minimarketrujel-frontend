<app-page-header
  title="Clientes y Créditos"
  subtitle="Administra la cartera de clientes, límites de crédito y cuentas por cobrar">
  <div style="display: flex; gap: 0.75rem; align-items: center;">
    <button
      class="btn-excel"
      (click)="exportarExcel()"
      [disabled]="excelService.exportando() && excelService.tablaActual() === 'clientes'">
      <span class="material-icons">file_download</span>
      <span>{{ (excelService.exportando() && excelService.tablaActual() === 'clientes') ? 'Generando Excel...' : 'Exportar a Excel' }}</span>
    </button>
    <button (click)="abrirModalForm()" class="btn-primary">
      <span class="material-icons">person_add</span>
      <span>Nuevo Cliente</span>
    </button>
  </div>
</app-page-header>

<app-error-alert [message]="errorMessage()" (dismiss)="errorMessage.set(null)" />

<app-generic-table
  [data]="clientes()"
  [columns]="columns"
  [loading]="cargando()"
  [showActions]="true"
  searchPlaceholder="Buscar clientes por nombre, teléfono o DNI/RUC..."
  (edit)="abrirModalForm($event.id)"
  (delete)="eliminar($event)"
>
</app-generic-table>
