<app-page-header
  title="Catálogo de Productos"
  subtitle="Gestiona todos los productos del minimarket: precios, stock y categorías">
  <div style="display: flex; gap: 0.75rem; align-items: center;">
    <button
      class="btn-excel"
      (click)="exportarExcel()"
      [disabled]="excelService.exportando() && excelService.tablaActual() === 'productos'">
      <span class="material-icons">file_download</span>
      <span>{{ (excelService.exportando() && excelService.tablaActual() === 'productos') ? 'Generando Excel...' : 'Exportar a Excel' }}</span>
    </button>
    <button (click)="abrirModalForm()" class="btn-primary">
      <span class="material-icons">add</span>
      <span>Nuevo Producto</span>
    </button>
  </div>
</app-page-header>

<app-error-alert [message]="errorMessage()" (dismiss)="errorMessage.set(null)" />

<app-generic-table
  [data]="productos()"
  [columns]="columns"
  [loading]="cargando()"
  [showActions]="true"
  [showToggleStatus]="true"
  searchPlaceholder="Buscar por nombre o código de barras..."
  (edit)="abrirModalForm($event.id)"
  (toggleStatus)="toggleEstado($event)"
  (delete)="eliminar($event)"
>
</app-generic-table>
