<div class="table-filter-bar card">
  <div class="filter-controls-row">
    <!-- Buscador -->
    <div class="search-wrapper" *ngIf="showSearch">
      <span class="material-icons search-icon">search</span>
      <input
        type="text"
        class="form-control search-input"
        [placeholder]="placeholderSearch"
        [value]="searchValue"
        (input)="onSearchInput($event)"
      />
    </div>

    <!-- Selector de Ordenamiento -->
    <div class="sort-select-wrapper" *ngIf="options.length > 0">
      <label class="sort-label">
        <span class="material-icons">sort</span>
        <span>Ordenar por:</span>
      </label>
      <div class="select-container">
        <select class="form-control sort-select" [value]="selectedValue" (change)="onSortSelect($event)">
          <option *ngFor="let opt of options" [value]="opt.value">
            {{ opt.label }}
          </option>
        </select>
      </div>
    </div>
  </div>

  <!-- Badges / Accesos Rápidos de Ordenamiento -->
  <div class="quick-sort-chips" *ngIf="options.length > 0">
    <span class="chips-label">Filtros rápidos:</span>
    <button
      *ngFor="let opt of options"
      type="button"
      class="chip-btn"
      [class.active]="selectedValue === opt.value"
      (click)="setQuickSort(opt.value)">
      <span class="material-icons chip-icon" *ngIf="opt.icon">{{ opt.icon }}</span>
      <span>{{ opt.label }}</span>
    </button>
  </div>
</div>
